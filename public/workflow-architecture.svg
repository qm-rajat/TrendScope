<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <!-- Node Gradients -->
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes flowPacket {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .flow-line {
      stroke-dasharray: 12 12;
      animation: flowPacket 3s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 12 12;
      animation: flowPacket 3s linear infinite reverse;
    }
    .node-border {
      animation: pulseNode 3s ease-in-out infinite;
    }
  </style>

  <!-- Container Base -->
  <rect width="1100" height="360" rx="16" fill="url(#wfBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Flow Connector Paths -->
  <!-- Node 1 -> Node 2 -->
  <path d="M 230 180 L 330 180" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.3" />
  <path d="M 230 180 L 330 180" fill="none" stroke="#38BDF8" stroke-width="3" class="flow-line" filter="url(#wfGlow)" />

  <!-- Node 2 -> Node 3 -->
  <path d="M 520 180 L 620 180" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.3" />
  <path d="M 520 180 L 620 180" fill="none" stroke="#06B6D4" stroke-width="3" class="flow-line" filter="url(#wfGlow)" />

  <!-- Node 3 -> Node 4 -->
  <path d="M 810 180 L 910 180" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.3" />
  <path d="M 810 180 L 910 180" fill="none" stroke="#818CF8" stroke-width="3" class="flow-line" filter="url(#wfGlow)" />

  <!-- ==================== STAGE 1: Client Request & Geo Trigger ==================== -->
  <g transform="translate(40, 70)">
    <rect width="190" height="220" rx="14" fill="url(#nodeBlue)" stroke="#38BDF8" stroke-width="1.5" class="node-border" />
    <!-- Stage Header -->
    <rect width="190" height="36" rx="14" fill="#0B132B" />
    <circle cx="20" cy="18" r="5" fill="#38BDF8" />
    <text x="34" y="22" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">01 / CLIENT TRIGGER</text>

    <!-- Node Icon & Content -->
    <g transform="translate(20, 56)">
      <circle cx="24" cy="24" r="22" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1.5" />
      <text x="14" y="30" font-size="20">🌐</text>
      <text x="56" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Geo Select</text>
      <text x="56" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11">195+ Countries</text>
    </g>

    <!-- Sub items -->
    <g transform="translate(18, 120)">
      <rect width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Worldwide / ISO-3166</text>

      <rect y="32" width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="48" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Auto-Polling Timer (15s-5m)</text>

      <rect y="64" width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="80" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Client Telemetry Stream</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: Next.js Proxy & Security Shield ==================== -->
  <g transform="translate(330, 70)">
    <rect width="190" height="220" rx="14" fill="url(#nodeBlue)" stroke="#06B6D4" stroke-width="1.5" class="node-border" />
    <rect width="190" height="36" rx="14" fill="#0B132B" />
    <circle cx="20" cy="18" r="5" fill="#06B6D4" />
    <text x="34" y="22" fill="#06B6D4" font-family="monospace" font-size="11" font-weight="700">02 / SERVER PROXY</text>

    <g transform="translate(20, 56)">
      <circle cx="24" cy="24" r="22" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.5" />
      <text x="14" y="30" font-size="20">🛡️</text>
      <text x="56" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Secure Edge</text>
      <text x="56" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11">Next.js API Route</text>
    </g>

    <g transform="translate(18, 120)">
      <rect width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Zero-Leak API Secrets</text>

      <rect y="32" width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="48" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Custom Key vs Demo Switch</text>

      <rect y="64" width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="80" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Edge Header Injections</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: Telemetry & Normalizer Engine ==================== -->
  <g transform="translate(620, 70)">
    <rect width="190" height="220" rx="14" fill="url(#nodeBlue)" stroke="#818CF8" stroke-width="1.5" class="node-border" />
    <rect width="190" height="36" rx="14" fill="#0B132B" />
    <circle cx="20" cy="18" r="5" fill="#818CF8" />
    <text x="34" y="22" fill="#818CF8" font-family="monospace" font-size="11" font-weight="700">03 / NORMALIZER</text>

    <g transform="translate(20, 56)">
      <circle cx="24" cy="24" r="22" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.5" />
      <text x="14" y="30" font-size="20">⚡</text>
      <text x="56" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Velocity Engine</text>
      <text x="56" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11">Type Classification</text>
    </g>

    <g transform="translate(18, 120)">
      <rect width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Hashtag / Topic / Phrase</text>

      <rect y="32" width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="48" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Velocity Score (0-10)</text>

      <rect y="64" width="154" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="80" fill="#CBD5E1" font-family="sans-serif" font-size="10">• Exploding/Rising States</text>
    </g>
  </g>

  <!-- ==================== STAGE 4: Interactive Analytics Dashboard ==================== -->
  <g transform="translate(910, 70)">
    <rect width="150" height="220" rx="14" fill="url(#nodeBlue)" stroke="#34D399" stroke-width="1.5" class="node-border" />
    <rect width="150" height="36" rx="14" fill="#0B132B" />
    <circle cx="20" cy="18" r="5" fill="#34D399" />
    <text x="34" y="22" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">04 / DASHBOARD</text>

    <g transform="translate(16, 56)">
      <circle cx="20" cy="20" r="18" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1.5" />
      <text x="10" y="26" font-size="18">📊</text>
      <text x="46" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Live UI</text>
      <text x="46" y="32" fill="#94A3B8" font-family="sans-serif" font-size="10">Recharts &amp; Grid</text>
    </g>

    <g transform="translate(12, 120)">
      <rect width="126" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="16" fill="#CBD5E1" font-family="sans-serif" font-size="9.5">• 3-Way Type Filter</text>

      <rect y="32" width="126" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="48" fill="#CBD5E1" font-family="sans-serif" font-size="9.5">• 2-Country Diff</text>

      <rect y="64" width="126" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="80" fill="#CBD5E1" font-family="sans-serif" font-size="9.5">• 24h Rank Shifts</text>
    </g>
  </g>
</svg>
