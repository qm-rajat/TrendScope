<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 380" width="100%" height="100%">
  <defs>
    <!-- Node Gradients -->
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes flowPacket {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    .flow-line {
      stroke-dasharray: 12 12;
      animation: flowPacket 3s linear infinite;
    }
    .node-border {
      animation: pulseNode 3s ease-in-out infinite;
    }
  </style>

  <!-- Container Base -->
  <rect width="1150" height="380" rx="16" fill="url(#wfBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Flow Connector Paths -->
  <!-- Node 1 -> Node 2 -->
  <path d="M 255 190 L 335 190" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.3" />
  <path d="M 255 190 L 335 190" fill="none" stroke="#38BDF8" stroke-width="3" class="flow-line" filter="url(#wfGlow)" />

  <!-- Node 2 -> Node 3 -->
  <path d="M 555 190 L 635 190" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.3" />
  <path d="M 555 190 L 635 190" fill="none" stroke="#06B6D4" stroke-width="3" class="flow-line" filter="url(#wfGlow)" />

  <!-- Node 3 -> Node 4 -->
  <path d="M 855 190 L 935 190" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.3" />
  <path d="M 855 190 L 935 190" fill="none" stroke="#818CF8" stroke-width="3" class="flow-line" filter="url(#wfGlow)" />

  <!-- ==================== STAGE 1: Portal Gate & PIN Security ==================== -->
  <g transform="translate(35, 60)">
    <rect width="220" height="260" rx="14" fill="url(#nodeBlue)" stroke="#38BDF8" stroke-width="1.5" class="node-border" />
    <!-- Stage Header -->
    <rect width="220" height="38" rx="14" fill="#0B132B" />
    <circle cx="20" cy="19" r="5" fill="#38BDF8" />
    <text x="34" y="23" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">01 / PORTAL GATE</text>

    <!-- Node Icon & Content -->
    <g transform="translate(20, 52)">
      <circle cx="24" cy="24" r="22" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1.5" />
      <text x="14" y="30" font-size="20">🔒</text>
      <text x="56" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Access Control</text>
      <text x="56" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11">PIN Verification</text>
    </g>

    <!-- Sub items -->
    <g transform="translate(16, 116)">
      <rect width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="19" fill="#60A5FA" font-family="sans-serif" font-size="11" font-weight="600">⚡ Code 7492: Advance Panel</text>

      <rect y="38" width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="57" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600">🏷️ Code 7491: Top Hashtags</text>

      <rect y="76" width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="95" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• Isolated Session Memory</text>

      <rect y="114" width="188" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="130" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• Instant Lock &amp; Logout</text>
    </g>
  </g>

  <!-- ==================== STAGE 2: Next.js Proxy & Security Shield ==================== -->
  <g transform="translate(335, 60)">
    <rect width="220" height="260" rx="14" fill="url(#nodeBlue)" stroke="#06B6D4" stroke-width="1.5" class="node-border" />
    <rect width="220" height="38" rx="14" fill="#0B132B" />
    <circle cx="20" cy="19" r="5" fill="#06B6D4" />
    <text x="34" y="23" fill="#06B6D4" font-family="monospace" font-size="11" font-weight="700">02 / EDGE PROXY</text>

    <g transform="translate(20, 52)">
      <circle cx="24" cy="24" r="22" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.5" />
      <text x="14" y="30" font-size="20">🛡️</text>
      <text x="56" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Secure Ingestion</text>
      <text x="56" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11">Next.js API Routes</text>
    </g>

    <g transform="translate(16, 116)">
      <rect width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="19" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• Zero-Client Secrets Exposure</text>

      <rect y="38" width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="57" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• GetXAPI Live / Synthetic Fallback</text>

      <rect y="76" width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="95" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• 195+ Countries ISO Mapping</text>

      <rect y="114" width="188" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="130" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• Auto-Polling Timer Ingestion</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: Telemetry & Normalizer Engine ==================== -->
  <g transform="translate(635, 60)">
    <rect width="220" height="260" rx="14" fill="url(#nodeBlue)" stroke="#818CF8" stroke-width="1.5" class="node-border" />
    <rect width="220" height="38" rx="14" fill="#0B132B" />
    <circle cx="20" cy="19" r="5" fill="#818CF8" />
    <text x="34" y="23" fill="#818CF8" font-family="monospace" font-size="11" font-weight="700">03 / NORMALIZER</text>

    <g transform="translate(20, 52)">
      <circle cx="24" cy="24" r="22" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.5" />
      <text x="14" y="30" font-size="20">⚡</text>
      <text x="56" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Velocity Engine</text>
      <text x="56" y="36" fill="#94A3B8" font-family="sans-serif" font-size="11">Classification &amp; Scoring</text>
    </g>

    <g transform="translate(16, 116)">
      <rect width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="19" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• 3-Way: #Hashtag / Topic / Phrase</text>

      <rect y="38" width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="57" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• Velocity Index (0.0 - 10.0)</text>

      <rect y="76" width="188" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="95" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• EXPLODING 🔥 / RISING Status</text>

      <rect y="114" width="188" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="130" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">• Trajectory Curve Computation</text>
    </g>
  </g>

  <!-- ==================== STAGE 4: Dual Workspaces ==================== -->
  <g transform="translate(935, 60)">
    <rect width="180" height="260" rx="14" fill="url(#nodeBlue)" stroke="#34D399" stroke-width="1.5" class="node-border" />
    <rect width="180" height="38" rx="14" fill="#0B132B" />
    <circle cx="20" cy="19" r="5" fill="#34D399" />
    <text x="34" y="23" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">04 / WORKSPACES</text>

    <g transform="translate(16, 52)">
      <circle cx="20" cy="20" r="18" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1.5" />
      <text x="10" y="26" font-size="18">📊</text>
      <text x="46" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Isolated UI</text>
      <text x="46" y="32" fill="#94A3B8" font-family="sans-serif" font-size="10">Recharts &amp; Copier</text>
    </g>

    <g transform="translate(12, 116)">
      <rect width="156" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="19" fill="#60A5FA" font-family="sans-serif" font-size="10" font-weight="600">⚡ Advance Panel (7492)</text>

      <rect y="38" width="156" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="57" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="600">🏷️ Top Hashtags (7491)</text>

      <rect y="76" width="156" height="30" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="95" fill="#CBD5E1" font-family="sans-serif" font-size="9.5">• 2-Country Diff Overlap</text>

      <rect y="114" width="156" height="24" rx="6" fill="#070B14" stroke="#1E293B" stroke-width="1" />
      <text x="8" y="130" fill="#CBD5E1" font-family="sans-serif" font-size="9.5">• 1-Click Copy All Tags</text>
    </g>
  </g>
</svg>
